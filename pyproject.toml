[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "maras"
version = "1.0.0"
description = "Multi-Agent Resource Allocation Simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "gymnasium>=0.29",
    "pettingzoo>=1.24",
    "torch>=2.0",
    "pandas>=2.0",
    "plotly>=5.15",
    "streamlit>=1.28",
    "httpx>=0.24",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
